services:
  ollama:
    image: ollama/ollama:latest
    container_name: ollama-gpu
    restart: unless-stopped

    # GPU passthrough - critical for performance
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

    # Expose Ollama API to host
    ports:
      - "11434:11434"

    # Persist models (60-77GB) across container restarts
    volumes:
      - ./.ollama-data:/root/.ollama

    # Keep model loaded in VRAM indefinitely (reduces TTFT)
    environment:
      - OLLAMA_KEEP_ALIVE=-1

    # Health check - verify Ollama is responding
    healthcheck:
      test: ["CMD-SHELL", "ollama ps || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  searxng:
    image: searxng/searxng:latest
    container_name: searxng
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./searxng:/etc/searxng:rw
    environment:
      - SEARXNG_BASE_URL=http://localhost:8080
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/search?q=test&format=json"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
