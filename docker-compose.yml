services:
  ollama:
    image: ollama/ollama:latest
    container_name: ollama-gpu
    restart: unless-stopped

    # GPU passthrough - critical for performance
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

    # Expose Ollama API to host
    ports:
      - "11434:11434"

    # Persist models (60-77GB) across container restarts
    volumes:
      - ./.ollama-data:/root/.ollama

    # Health check
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
