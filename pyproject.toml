[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ai-agents"
version = "0.2.0"
description = "Personal AI agent system using LangGraph"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "Nat Bishop", email = "nate@bishopsca.com" }
]
keywords = ["ai", "agents", "langgraph", "automation"]

dependencies = [
    # LangGraph & LangChain (Nov 2025 - LangChain 1.0!)
    "langgraph>=1.0.3,<1.0.4",  # 1.0.4 has breaking change with deepagents
    "langchain-core>=1.1.0",
    "langchain-community>=0.3.0",  # SearxSearchWrapper for web search
    "langchain-openai>=1.1.0",  # Used for Ollama (better tool calling than langchain-ollama)

    # Deep Agents (subagents, context management, long-term memory)
    "deepagents>=0.2.8",

    # Web & Browser
    "playwright>=1.49.0",

    # Config & Utilities
    "pydantic>=2.12.5",
    "pydantic-settings>=2.7.0",
    "python-dotenv>=1.0.1",

    # Logging & Storage
    "structlog>=25.1.0",
    "aiosqlite>=0.21.0",
    "psycopg[binary,pool]>=3.2.0",  # PostgreSQL driver
    "langgraph-checkpoint-postgres>=2.0.0",  # LangGraph PostgresStore

    # HTTP
    "httpx>=0.28.0",

    # Web scraping (for fetch_page tool)
    "html2text>=2024.2.26",

    # Config
    "PyYAML>=6.0",

    # Observability
    "langfuse>=3.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.25.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.8.0",
    "mypy>=1.14.0",
]

vllm = [
    "vllm>=0.7.0",
]

[project.urls]
Repository = "https://github.com/nat-bishop/ai-agents"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # Pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
]
ignore = [
    "E501",   # line too long (handled by formatter)
]

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_ignores = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
