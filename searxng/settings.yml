# SearXNG configuration for local AI agent use
# Docs: https://docs.searxng.org/admin/settings/

use_default_settings: true

server:
  # Generate a unique key: python -c "import secrets; print(secrets.token_hex(32))"
  secret_key: "ai-agents-local-searxng-key-change-in-production"
  limiter: false  # Disable rate limiting for local use
  image_proxy: false  # Not needed for text search

# Force IPv4 to avoid Google blocking IPv6
outgoing:
  source_ips:
    - 0.0.0.0

search:
  safe_search: 0  # Disable safe search for job searches
  default_lang: en
  formats:
    - html
    - json  # Required for API access

# Enable multiple engines for redundancy
# If one is rate-limited, others should still work
engines:
  # Primary engines
  - name: google
    disabled: false
    weight: 1.5
    timeout: 8.0

  - name: duckduckgo
    disabled: false
    weight: 1.3
    timeout: 10.0  # Longer timeout for reliability

  - name: brave
    disabled: false
    weight: 1.2

  # Fallback engines (less likely to rate-limit)
  - name: mojeek
    disabled: false
    weight: 1.0  # UK-based, independent index

  - name: yahoo
    disabled: false
    weight: 0.9
    timeout: 8.0

  - name: startpage
    disabled: false
    weight: 0.8  # Google proxy, sometimes blocked

  - name: qwant
    disabled: false
    weight: 0.7

  # Disable broken/irrelevant engines
  - name: bing
    disabled: true  # Often returns garbage
  - name: wikidata
    disabled: true
  - name: wikipedia
    disabled: true
